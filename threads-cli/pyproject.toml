[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threads-cli"
version = "0.1.0"
description = "Threads API CLI for coding agents — your own account (profile, posts, replies, insights, publish) via Authorization Code OAuth (manual paste-back)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["threads", "meta", "social", "cli", "agent", "oauth"]
authors = [{ name = "Bo-Yu Chen", email = "bernie40916@gmail.com" }]

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "patchboy-core",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
threads = "threads_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/threads_cli"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
patchboy-core = { workspace = true }
