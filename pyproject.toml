[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spotify-cli"
version = "0.1.0"
description = "Spotify Web API CLI for coding agents — catalog search + user account (playlists, saved tracks) via Authorization Code + PKCE."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["spotify", "music", "cli", "agent", "oauth", "pkce"]
authors = [{ name = "Bo-Yu Chen", email = "bernie40916@gmail.com" }]

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
spotify = "spotify_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spotify_cli"]

[tool.ruff]
line-length = 100
