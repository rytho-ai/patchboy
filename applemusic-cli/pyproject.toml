[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "applemusic-cli"
version = "0.1.0"
description = "Apple Music API CLI for coding agents — catalog search + your library (playlists, saved songs) via a borrowed developer token + media-user-token."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["applemusic", "music", "cli", "agent", "musickit"]
authors = [{ name = "Bo-Yu Chen", email = "bernie40916@gmail.com" }]

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Firefox login needs no dependency (unencrypted sqlite). Chromium-family
# browsers (chrome/chromium/brave/edge) encrypt cookie values → browser_cookie3.
chrome = ["browser-cookie3>=0.19"]
dev = ["pytest>=8.0", "ruff>=0.4", "mypy>=1.10", "browser-cookie3>=0.19"]

[project.scripts]
applemusic = "applemusic_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/applemusic_cli"]

[tool.ruff]
line-length = 100

[[tool.mypy.overrides]]
module = "browser_cookie3"  # third-party, ships no type stubs
ignore_missing_imports = true
